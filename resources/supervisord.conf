[supervisord]
logfile=/workspace/usu/data/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true

[program:Xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x16
autostart=true
autorestart=true
priority=1
environment=DISPLAY=":1"

[program:fluxbox]
command=/usr/bin/fluxbox
autostart=true
autorestart=true
priority=2
environment=DISPLAY=":1"

[program:xterm]
command=/usr/bin/xterm
autostart=true
autorestart=true
priority=3
environment=DISPLAY=":1"

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -nopw -shared
autostart=true
autorestart=true
priority=4

[program:novnc]
command=/opt/novnc/utils/launch.sh --vnc localhost:5900 --listen 80
autostart=true
autorestart=true
priority=5



