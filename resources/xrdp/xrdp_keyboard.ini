[default]
keyboard_type=4
keyboard_subtype=1
rdp_layouts=default_rdp_layouts
layouts_map=default_layouts_map

[default_rdp_layouts]
rdp_layout_de=0x00000407
rdp_layout_us=0x00000409  ; ← US-Layout-Code, wird auf Deutsch gemappt

[default_layouts_map]
rdp_layout_de=de
rdp_layout_us=de          ; ← US wird auf "de" gemappt


