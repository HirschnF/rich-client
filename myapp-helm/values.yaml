# # Kubernetes Namespace für die App
namespace: consult-usifhirsch-55

user: user456

enablePersistence: false

image:
  repository: frank1977/jetty-rich-client
  tag: usm5.5.01.03
  pullPolicy: Always


imagePullSecrets:
  - name: usu-regcred

ingress:
  enabled: true
  className: nginx
  certManager: true
  annotations:
    cert-manager.io/cluster-issuer: usu-group-issuer
  hostname: rc.consult-usifhirsch-55.k8s-dev001.aspera.usu.grp
  tls: true

storage:
  size: 1Gi
  storageClassName: vsphere-csi-sc

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi


