# # Kubernetes Namespace für die App
# namespace: consult-usifhirsch-55
# # Benutzerkennung (für URL + Ressourcen)
# user: vm

# image:
#   repository: frank1977/jetty-rich-client
#   tag: java17-Novnc

# storage:
#   size: 1Gi

# # Basis-Domain für Ingress (z. B. von NGINX)
# domain: rc.consult-usifhirsch-55.k8s-dev001.aspera.usu.grp

namespace: consult-usifhirsch-55

user: user456

image:
  repository: frank1977/jetty-rich-client
  tag: java17-novnc
  pullPolicy: Always

imagePullSecrets:
  - name: usu-regcred

ingress:
  enabled: true
  className: nginx
  certManager: true
  annotations:
    cert-manager.io/cluster-issuer: usu-group-issuer
  hostname: rc.consult-usifhirsch-55.k8s-dev001.aspera.usu.grp
  tls: true

storage:
  size: 1Gi

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
