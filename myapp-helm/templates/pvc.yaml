apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myapp-{{ .Values.user }}-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}