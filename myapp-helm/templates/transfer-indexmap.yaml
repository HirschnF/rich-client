apiVersion: v1
kind: ConfigMap
metadata:
  name: transfer-index-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
data:
  transfer.html: |
    <!DOCTYPE html>
      <html lang="de">
      <head>
        <meta charset="UTF-8">
        <title>Datei Upload & Download</title>
        <style>
          body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
          input[type="file"] { margin-bottom: 1rem; }
          ul { list-style: none; padding-left: 0; }
          li { margin-bottom: 0.5rem; }
          button { margin-top: 1rem; }
        </style>
      </head>
      <body>

        <h1>📁 Datei-Transfer</h1>

        <h2>🔼 Datei hochladen</h2>
        <input type="file" id="fileInput" />
        <br />
        <button onclick="uploadFile()">Hochladen</button>

        <h2>🔽 Verfügbare Dateien</h2>
        <button onclick="listFiles()">Dateien anzeigen</button>
        <ul id="fileList"></ul>

        <script>
          const UPLOAD_URL = "/workspace/usu/data/";  // Zielpfad
          const LIST_URL = "/workspace/usu/list.json"; // Datei-Liste
          const DOWNLOAD_URL = "/workspace/usu/data/";       // Download-Pfad


          async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) {
              alert("Bitte eine Datei auswählen.");
              return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            try {
              const response = await fetch(UPLOAD_URL, {
                method: "POST",
                body: formData
              });

              if (response.ok) {
                alert("✅ Datei erfolgreich hochgeladen!");
                listFiles();
              } else {
                alert("❌ Upload fehlgeschlagen: " + response.statusText);
              }
            } catch (err) {
              alert("❌ Netzwerkfehler: " + err.message);
            }
          }

          async function listFiles() {
            try {
              const response = await fetch(LIST_URL);
              if (!response.ok) {
                throw new Error("Fehler beim Abrufen der Dateiliste");
              }

              const files = await response.json();
              const fileList = document.getElementById("fileList");
              fileList.innerHTML = "";

              files.forEach(fileName => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = DOWNLOAD_URL + encodeURIComponent(fileName);
                a.textContent = fileName;
                a.download = fileName;
                li.appendChild(a);
                fileList.appendChild(li);
              });
            } catch (err) {
              alert("❌ Fehler beim Laden der Dateiliste: " + err.message);
            }
          }
        </script>

      </body>
      </html>
