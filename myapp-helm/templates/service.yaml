apiVersion: v1
kind: Service
metadata:
  name: myapp-{{ .Values.user }}-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: myapp
    user: {{ .Values.user }}
  ports:
    - name: vnc
      port: 80
      targetPort: 80
    - name: frontend
      port: 8087
      targetPort: 8087
# 09.06.2025 ergänzt um auf den Port zugreifen zu können      
    - name: rfb
      port: 5900
      targetPort: 5900
    - name: novnc
      port: 6000
      targetPort: 6000
