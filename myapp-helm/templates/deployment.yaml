apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      user: {{ .Values.user }}
  template:
    metadata:
      labels:
        app: myapp
        user: {{ .Values.user }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      # Schreibrechte notwendig, da der POD sonst abstürzt            
      # wir wollen das nun als root laufen lassen
      # securityContext:
      #   fsGroup: 1000  # oder 101, je nach Container-User

      #INIT Container wird nicht benötigt
      # initContainers:
      #   - name: init-volume
      #     image: busybox
      #     command: ["sh", "-c", "mkdir -p /workspace/usu/rc-client/data/ && chmod -R 777 /workspace/usu/rc-client/data/"]
      #     volumeMounts:
      #       - name: shared-data
      #         mountPath: /workspace/usu/data
      containers:
        - name: myapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # 11.06.2025 - den Container am Leben halten für 10h
          #command: ["sh", "-c", 'echo "Hello, Kubernetes!" && /usr/bin/supervisord -c /app/supervisord.conf'] #&& tail -f /dev/null']
          #command: ["sh", "-c", 'echo "Hello, Kubernetes!" && /startup.sh'] #&& tail -f /dev/null']
          command: ["sh", "-c", 'echo "Hello, Kubernetes!" && /usr/bin/supervisord -c /app/supervisord.conf && tail -f /dev/null'] # && tail -f /dev/null']
          #command: ["sh", "-c", 'echo "Hello, Kubernetes!" && mkdir -p /workspace/usu/rc-client/data/ && chmod -R 777 /workspace/usu/rc-client/data/ && tail -f /dev/null']
          # It is for running as the root user
          securityContext:
            runAsUser: 0
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 8087
# 09.06.2025 ergänzt um auf den Port zugreifen zu können                  
            - containerPort: 5900
            - containerPort: 6000
          env:
            - name: DISPLAY_WIDTH
              value: "1600"
            - name: DISPLAY_HEIGHT
              value: "900"
# 19.6.25 dynamisch die loginconfigurations.xml aufbauen
          volumeMounts:
            - name: login-config
              mountPath: /root/.valuemation/loginConfigurations.xml
              subPath: loginConfigurations.xml

#           volumeMounts:
#             - name: shared-data
# #              mountPath: /data
# #              mountPath: /workspace
#               mountPath: /workspace/usu/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: login-config
          configMap:
          name: login-config-{{ .Values.user }}

      # volumes:
      #   - name: shared-data
      #     persistentVolumeClaim:
      #       claimName: myapp-{{ .Values.user }}-pvc

