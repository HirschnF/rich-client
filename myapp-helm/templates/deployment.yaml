apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      user: {{ .Values.user }}
  template:
    metadata:
      labels:
        app: myapp
        user: {{ .Values.user }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      # Schreibrechte notwendig, da der POD sonst abstürzt            
      securityContext:
        fsGroup: 1000  # oder 101, je nach Container-User
      # initContainers:
      #   - name: init-volume
      #     image: busybox
      #     command: ["sh", "-c", "mkdir -p /workspace/usu/rc-client/data/ && chmod -R 777 /workspace/usu/rc-client/data/"]
      #     volumeMounts:
      #       - name: shared-data
      #         mountPath: /workspace/usu/data
      containers:
        - name: myapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 8087
# 09.06.2025 ergänzt um auf den Port zugreifen zu können                  
            - containerPort: 5900
            - containerPort: 6000
          volumeMounts:
            - name: shared-data
#              mountPath: /data
#              mountPath: /workspace
              mountPath: /workspace/usu/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: myapp-{{ .Values.user }}-pvc

