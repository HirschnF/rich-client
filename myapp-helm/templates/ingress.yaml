apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-{{ .Values.user }}-ingress
  namespace: {{ .Values.namespace }}  
    {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname }}
      secretName: tls-{{ .Values.user }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /{{ .Values.user }}/gui
            pathType: Prefix
            backend:
              service:
                name: myapp-{{ .Values.user }}-svc
                port:
                  number: 80
          - path: /{{ .Values.user }}/frontend
            pathType: Prefix
            backend:
              service:
                name: myapp-{{ .Values.user }}-svc
                port:
                  number: 8087
# 09.06.2025 ergänzt um auf den Port zugreifen zu können      
          - path: /{{ .Values.user }}/novnc
            pathType: Prefix
            backend:
              service:
                name: myapp-{{ .Values.user }}-svc
                port:
                  number: 6000
          - path: /{{ .Values.user }}/rfb
            pathType: Prefix
            backend:
              service:
                name: myapp-{{ .Values.user }}-svc
                port:
                  number: 5900
