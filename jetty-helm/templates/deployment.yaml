apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
  labels:
    app: rc
    user: {{ .Values.user }}
    version: "{{ .Values.image.version }}"
    revision: {{ .Release.Revision | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rc
      user: {{ .Values.user }}
  template:
    metadata:
      labels:
        app: rc
        user: {{ .Values.user }}
        version: "{{ .Values.image.version }}"
        revision: {{ .Release.Revision | quote }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      serviceAccountName: rc-{{ .Values.user }}-svca
      containers:
        - name: rc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          env:
            - name: TZ
              value: Europe/Berlin
            # 28.03.2026 HiF: Die Proxy-Settings sind hier direkt in der values.yaml, damit sie auch für die Init-Container gelten, die ja vor der eigentlichen Applikation laufen und daher noch keinen Zugriff auf die Secrets haben. Sobald die Proxy-Settings in den Secrets geändert werden müssen, müssen sie hier manuell angepasst werden. Es wäre zwar möglich, die Proxy-Settings auch in den Secrets zu hinterlegen und dann per Init-Container in Umgebungsvariablen zu schreiben, aber das ist deutlich aufwändiger umzusetzen.
            {{- if .Values.proxy.enabled }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.httpsProxy | quote }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}

            # Manche Tools erwarten lowercase-Varianten
            - name: http_proxy
              value: {{ .Values.proxy.httpProxy | quote }}
            - name: https_proxy
              value: {{ .Values.proxy.httpsProxy | quote }}
            - name: no_proxy
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}

            - name: HOME
              value: "/home/tomcat"
            - name: CATALINA_BASE
              value: "/usr/share/tomcat9"
            # Benutzer und PW codieren
            - name: RDP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rc-user-secret
                  key: username
            - name: RDP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rc-user-secret
                  key: password
            - name: GEOMETRY
              value: ${GEOMETRY:-{{ .Values.Geometry }}}
            - name: DEPTH
              value: ${DEPTH:-{{ .Values.Depth }}}
            - name: JAVA_OPTS
              value: "-Dguacamole.home=/etc/guacamole"
            #- name: PATH
            #  value: "/usr/sbin:/usr/bin:/bin"
            - name: XRDP_SOCKET_PATH
              value: /tmp
              #/.xrdp-sockdir
              # zieht leider nicht für den Benutzer, sondern nur für root

          # 11.06.2025 - den Container am Leben halten
          # 26.06.2025 - ADD special user
          command: 
            - sh
            - -c
            - | 
              useradd -m -s /bin/bash "$RDP_USERNAME" 2>/dev/null && \
              echo "$RDP_USERNAME:$RDP_PASSWORD" | chpasswd && \
              cp /home/tomcat/.xsession /home/$RDP_USERNAME && \
              cp /home/tomcat/.menu-xsession /home/$RDP_USERNAME && \
              cp -r /home/tomcat/.valuemation /home/$RDP_USERNAME && \
              mkdir -p /home/$RDP_USERNAME/.mozilla/firefox && \
              tar xzvf /home/tomcat/firefox-profile.tar.gz -C /home/$RDP_USERNAME/.mozilla/firefox && \
              chmod +x /home/$RDP_USERNAME/.xsession && \
              chmod +x /home/$RDP_USERNAME/.menu-xsession && \
              chown -R $RDP_USERNAME:$RDP_USERNAME /home/$RDP_USERNAME && \
              echo "$RDP_USERNAME ALL=(ALL) NOPASSWD: /bin/kill -9 -1 1" | sudo tee /etc/sudoers.d/killall 2>/dev/null && \
              chmod 440 /etc/sudoers.d/killall 2>/dev/null && \
              ln -s /workspace/usu/data/ /home/$RDP_USERNAME/data && \
              echo '#!/bin/bash
              set -e
              /usr/sbin/xrdp-sesman --nodaemon &
              sleep 1
              exec /usr/sbin/xrdp -n' > /usr/local/bin/xrdp-wrapper.sh && \
              chmod +x /usr/local/bin/xrdp-wrapper.sh && \
              touch /tmp/clipboardhost.txt && \
              chown tomcat:$RDP_USERNAME /tmp/clipboardhost.txt && \
              chmod 660 /tmp/clipboardhost.txt && \
              touch /tmp/clipboardguest.txt && \
              chown $RDP_USERNAME:tomcat /tmp/clipboardguest.txt && \
              chmod 660 /tmp/clipboardguest.txt && \
              /usr/bin/supervisord -c /etc/supervisor/supervisord.conf && \
              tail -f /dev/stdout
          
          #chmod +x /usr/local/bin/xvnc-wrapper.sh && \
          #cp /home/tomcat/firefox-profile.tar.gz /home/$RDP_USERNAME/.mozilla/firefox && \
          # It is for running as the root user
          securityContext:
            runAsUser: 0
          
          ports:
            - containerPort: 8080   # Guacamole Web
            - containerPort: 8087   # Jetty
            - containerPort: 8000   # Uploadserver
            - containerPort: 3389   # RDP
            - containerPort: 4822   # guacd
          
            
# 19.6.25 dynamisch die loginconfigurations.xml aufbauen
          volumeMounts:
            - name: login-config
              mountPath: /home/tomcat/.valuemation/loginConfigurations.xml
              subPath: loginConfigurations.xml
            - name: flask
              mountPath: /workspace/usu/uploadserver.py
              subPath: uploadserver.py
            - name: setenvuser
              mountPath: /workspace/usu/rc-client/set_env_user.sh
              subPath: set_env_user.sh
            - name: user-mapping
              mountPath: /etc/guacamole/user-mapping.xml
              subPath: user-mapping.xml
            - name: user-xsession
              mountPath: /home/tomcat/.xsession
              subPath: .xsession
            - name: menu-xsession
              mountPath: /home/tomcat/.menu-xsession
              subPath: .menu-xsession
            # - name: tomcat-web
            #   mountPath: /usr/share/tomcat9/conf/web.xml
            #   subPath: web.xml
            # - name: guacamole-properties
            #   mountPath: /etc/guacamole/guacamole.properties
            #   subPath: guacamole.properties
            # - name: sesman-ini
            #   mountPath: /etc/xrdp/sesman.ini
            #   subPath: sesman.ini
            - name: xrdp-ini
              mountPath: /etc/xrdp/xrdp.ini
              subPath: xrdp.ini
            - name: supervisord-conf
              mountPath: /etc/supervisor/supervisord.conf
              subPath: supervisord.conf
            - name: logo-usermap
              mountPath: /var/lib/tomcat9/webapps/guacamole/images/guac-tricolor.svg
              subPath: guac-tricolor.svg
            - name: translation-usermap
              mountPath: /var/lib/tomcat9/webapps/guacamole/translations/en.json
              subPath: en.json
            # - name: valuemation-config
            #   mountPath: /home/tomcat/.valuemation/valuemation.ini
            #   subPath: valuemation.ini
            #- name: xrdp-wrapper
            #  mountPath: /usr/local/bin/xrdp-wrapper.sh
            #  subPath: xrdp-wrapper.sh
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: login-config
          configMap:
            name: login-config-{{ .Values.user }}
        - name: flask
          configMap:
            name: flask-uploadsrv-{{ .Values.user }}
        - name: setenvuser
          configMap:
            name: setenvuser-{{ .Values.user }}
        - name: user-mapping
          configMap:
            name: guacamole-user-mapping-{{ .Values.user }}
        - name: user-xsession
          configMap:
            name: user-xsession-{{ .Values.user }}
        - name: menu-xsession
          configMap:
            name: menu-xsession-{{ .Values.user }}
        
        #- name: xrdp-wrapper
        #  configMap:
        #    name: xrdp-wrapper-{{ .Values.user }}    

        # - name: tomcat-web
        #   configMap:
        #     name: guacamole-tomcat-web-mapping-{{ .Values.user }}
        # - name: guacamole-properties
        #   configMap:
        #     name: guacamole-properties-mapping-{{ .Values.user }}
        # - name: sesman-ini
        #   configMap:
        #     name: sesman-ini-{{ .Values.user }}
        - name: xrdp-ini
          configMap:
            name: xrdp-ini-{{ .Values.user }}
        - name: supervisord-conf
          configMap:
            name: supervisord-conf-{{ .Values.user }}
        - name: logo-usermap
          configMap:
            name: logo-usermap-{{ .Values.user }}
        - name: translation-usermap
          configMap:
            name: translation-usermap-{{ .Values.user }}
        # - name: valuemation-config
        #   configMap:
        #     name: valuemation-config-{{ .Values.user }}
        # - name: xvnc-wrapper
        #   configMap:
        #     name: xvnc-wrapper-{{ .Values.user }}