apiVersion: apps/v1
kind: Deployment
metadata:
  name: rc-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rc
      user: {{ .Values.user }}
  template:
    metadata:
      labels:
        app: rc
        user: {{ .Values.user }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: rc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # 11.06.2025 - den Container am Leben halten für 10h
          # 26.06.2025 - ADD special user
          
          #nicht notwendig wenn im Dockerfile ein CMD definiert ist, ansonsten würde das überschrieben werden
          #command: ["/usr/bin/supervisord", "-c", "/app/supervisord.conf"]
          
          #command: ["sh", "-c", 'echo "Hello, Kubernetes! I am $(whoami)" && echo "My home directory: $HOME" && /usr/bin/supervisord -c /app/supervisord.conf && tail -f /dev/stdout']
          #mkdir -p ~/.vnc && x11vnc -storepasswd 1234 ~/.vnc/passwd
          # python3 -m uploadserver --directory /workspace/usu/data &&
          # tail -f /dev/stdout'] # && tail -f /dev/null']
          #echo "feh --bg-scale /workspace/usu/logo.png" >> &&'
          # It is for running as the root user
          securityContext:
            runAsUser: 1000
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 8087
          env:
            - name: HOME
              value: "/home/usuuser"
            - name: DISPLAY_WIDTH
              value: "1600"
            - name: DISPLAY_HEIGHT
              value: "900"
# 19.6.25 dynamisch die loginconfigurations.xml aufbauen
          volumeMounts:
            - name: login-config
              mountPath: /home/usuuser/.valuemation/loginConfigurations.xml
              subPath: loginConfigurations.xml
            - name: novnc-index
              mountPath: /usr/share/novnc/index.html
              subPath: index.html
            - name: novnc-lite
              mountPath: /usr/share/novnc/vnc_lite.html
              subPath: vnc_lite.html
            - name: bashrc
              mountPath: /home/usuuser/.bashrc
              subPath: .bashrc
            - name: flask
              mountPath: /workspace/usu/uploadserver.py
              subPath: uploadserver.py
            - name: setenvuser
              mountPath: /workspace/usu/rc-client/set_env_user.sh
              subPath: set_env_user.sh
            - name: user-mapping
              mountPath: /etc/guacamole/user-mapping.xml
              subPath: user-mapping.xml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: login-config
          configMap:
            name: login-config-{{ .Values.user }}
        - name: novnc-index
          configMap:
            name: novnc-index-{{ .Values.user }}
        - name: novnc-lite
          configMap:
            name: novnc-lite-{{ .Values.user }}
        - name: bashrc
          configMap:
            name: bashrc-{{ .Values.user }}
        - name: flask
          configMap:
            name: flask-uploadsrv-{{ .Values.user }}
        - name: setenvuser
          configMap:
            name: setenvuser-{{ .Values.user }}
        - name: user-mapping
          configMap:
            name: guacamole-user-mapping