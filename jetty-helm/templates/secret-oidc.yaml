{{- /*
  Secret fuer die OIDC-/Flask-Konfiguration.

  Inhalt:
    - KEYCLOAK_CLIENT_SECRET  Client-Secret des Keycloak-Clients 'rc-transfer'
                              (confidential client). Muss zu dem Wert passen,
                              den Keycloak unter "Clients -> rc-transfer ->
                              Credentials" anzeigt.
    - FLASK_SECRET_KEY        Stabiler Random-Wert, mit dem Flask seine
                              Session-Cookies signiert. Wenn der Wert in
                              values.yaml leer ist, wird beim ersten Apply
                              einer generiert. Bei spaeteren helm-upgrade
                              wird das vorhandene Secret per lookup() gelesen,
                              damit aktive Sessions nicht invalidiert werden.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace "rc-transfer-oidc" }}
{{- $flaskKey := "" -}}
{{- if .Values.keycloak.flaskSecretKey -}}
  {{- $flaskKey = .Values.keycloak.flaskSecretKey -}}
{{- else if and $existing $existing.data (index $existing.data "FLASK_SECRET_KEY") -}}
  {{- $flaskKey = index $existing.data "FLASK_SECRET_KEY" | b64dec -}}
{{- else -}}
  {{- $flaskKey = randAlphaNum 64 -}}
{{- end -}}
{{- $clientSecret := required "❌ .Values.keycloak.transferClientSecret muss gesetzt sein (Wert aus Keycloak: Clients -> rc-transfer -> Credentials)" .Values.keycloak.transferClientSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: rc-transfer-oidc
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  KEYCLOAK_CLIENT_SECRET: {{ $clientSecret | b64enc }}
  FLASK_SECRET_KEY: {{ $flaskKey | b64enc }}
