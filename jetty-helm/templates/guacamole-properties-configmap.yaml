# guacamole.properties fuer Guacamole 1.6.0 mit OpenID-Connect (Keycloak) +
# JDBC-Auth gegen die bestehende MariaDB.
# Hinweise:
#   * "auth-provider" und "basic-user-mapping" sind Legacy-Properties (vor 1.0)
#     und werden in 1.6.0 ignoriert.
#   * Der FileAuthenticationProvider liefert fuer per OIDC authentisierte Nutzer
#     keine Connections (Architekturlimit). Stattdessen verwendet diese
#     Konfiguration die JDBC-Extension; die Connections werden per Init-Container
#     in die Datenbank vorbefuellt.
#   * Die OpenID-Extension nutzt den Implicit Flow (response_type=id_token).
#     Erforderlich: issuer, client-id, authorization-endpoint, jwks-endpoint,
#     redirect-uri und (fuer Keycloak) username-claim-type.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-properties-mapping-{{ .Values.user }}
data:
  guacamole.properties: |
    guacd-hostname: localhost
    guacd-port: 4822
    enable-clipboard-autopaste: true

    # --- OpenID Connect (Keycloak, Implicit Flow) ---
    openid-issuer:                 {{ .Values.openid.issuer }}
    openid-client-id:              {{ .Values.openid.clientId }}
    openid-authorization-endpoint: {{ .Values.openid.authorizationEndpoint }}
    openid-jwks-endpoint:          {{ .Values.openid.jwksEndpoint }}

    # Redirect muss exakt mit "Valid Redirect URIs" im Keycloak-Client uebereinstimmen.
    openid-redirect-uri:           {{ .Values.openid.redirectUri }}

    # Claim, der als Guacamole-Username verwendet wird. Muss zu den
    # Eintraegen in der guacamole_user-Tabelle passen (per Init-Container vorbefuellt).
    openid-username-claim-type:    preferred_username

    # --- JDBC (MariaDB) ---
    mysql-hostname:                {{ .Values.db.host }}
    mysql-port:                    {{ .Values.db.port }}
    mysql-database:                {{ .Values.guacamoleDb.database }}
    mysql-username:                {{ .Values.guacamoleDb.username }}
    mysql-password:                {{ .Values.guacamoleDb.password }}
    mysql-driver:                  {{ .Values.guacamoleDb.driver }}

    # Bei OIDC-Login einen neuen User in der JDBC-DB anlegen, falls noch nicht
    # vorhanden. Dann muessen Verbindungs-Permissions per User-Group erteilt
    # werden -- der Init-Container legt dafuer die Gruppe "rc-users" an,
    # weist ihr die Connection zu, und ueber openid-default-user-groups landet
    # jeder OIDC-User automatisch in dieser Gruppe.
    mysql-auto-create-accounts:    true
    openid-default-user-groups:    rc-users
