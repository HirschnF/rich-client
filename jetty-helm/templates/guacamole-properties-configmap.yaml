# guacamole.properties für Guacamole 1.6.0 mit OpenID-Connect (Keycloak).
# Hinweise:
#   * "auth-provider" und "basic-user-mapping" sind Legacy-Properties (vor 1.0)
#     und werden in 1.6.0 ignoriert. Die file-basierte Authentifizierung wird
#     automatisch aktiviert, sobald /etc/guacamole/user-mapping.xml existiert.
#   * Die OpenID-Extension nutzt den Implicit Flow (response_type=id_token).
#     Daher werden weder openid-client-secret noch token-/userinfo-Endpoint
#     verwendet. Erforderlich: issuer, client-id, authorization-endpoint,
#     jwks-endpoint, redirect-uri und (für Keycloak) username-claim-type.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-properties-mapping-{{ .Values.user }}
data:
  guacamole.properties: |
    guacd-hostname: localhost
    guacd-port: 4822
    enable-clipboard-autopaste: true

    # --- OpenID Connect (Keycloak, Implicit Flow) ---
    openid-issuer:                 {{ .Values.openid.issuer }}
    openid-client-id:              {{ .Values.openid.clientId }}
    openid-authorization-endpoint: {{ .Values.openid.authorizationEndpoint }}
    openid-jwks-endpoint:          {{ .Values.openid.jwksEndpoint }}

    # Redirect muss exakt mit "Valid Redirect URIs" im Keycloak-Client uebereinstimmen.
    openid-redirect-uri:           {{ .Values.openid.redirectUri }}

    # Claim, der als Guacamole-Username verwendet wird. Muss zu den
    # username-Attributen in user-mapping.xml passen.
    openid-username-claim-type:    preferred_username
