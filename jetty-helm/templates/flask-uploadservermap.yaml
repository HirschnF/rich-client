#wird über Ressources direkt im Basis Image kopiert und so nicht mehr benötigt
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-uploadsrv-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
data:
  uploadserver.py: |
    #     # Die obige Flask-Anwendung wurde deaktiviert und um eine Clipboard-Funktionalität erweitert.
    #Keycloak Anpassung
    #from flask import Flask, request, send_from_directory, render_template_string, redirect, url_for, abort, jsonify
    from flask import Flask, request, send_from_directory, render_template_string, redirect, abort, jsonify, session
    import secrets
    from urllib.parse import quote

    from authlib.integrations.flask_client import OAuth
    from werkzeug.middleware.proxy_fix import ProxyFix
    #keycloak Anpassung Ende

    import os
    import base64
    import hashlib

    def _pkce_verifier() -> str:
        # RFC7636: 43..128 chars
        verifier = secrets.token_urlsafe(64)
        return verifier[:128]


    def _pkce_challenge_s256(verifier: str) -> str:
        digest = hashlib.sha256(verifier.encode("ascii")).digest()
        return base64.urlsafe_b64encode(digest).decode("ascii").rstrip("=")


    from werkzeug.utils import secure_filename

    # Configuration
    # transfer:
    # uploadlimit: 200 #MB
    # filetypes: "zip,xml,sql"
    UPLOAD_FOLDER = "/workspace/usu/data"
    #CLIPBOARD_FILE = "/tmp/clipboard.txt"
    #ALLOWED_EXTENSIONS = {"zip", "xml", "sql"}
    FILETYPES = "{{ .Values.transfer.filetypes }}"
    ALLOWED_EXTENSIONS = set(FILETYPES.split(","))
    USER = "{{ .Values.user }}"
    VERSION = "{{ .Values.image.tag }}"
    #INDEXPAGE = "{{ .Values.ingress.indexpage }}"

    app = Flask(__name__)
    #keycloak Anpassung
    # --- External base path (because Ingress rewrites /transfer -> /) ---
    EXTERNAL_BASE_PATH = os.environ.get("EXTERNAL_BASE_PATH", "/transfer").rstrip("/")

    # --- Flask session / cookies ---
    app.secret_key = os.environ.get("FLASK_SECRET_KEY") or secrets.token_hex(32)

    # Trust X-Forwarded-* headers from HAProxy/Ingress
    app.wsgi_app = ProxyFix(app.wsgi_app, x_proto=1, x_host=1)

    app.config.update(
        SESSION_COOKIE_SECURE=True,
        SESSION_COOKIE_HTTPONLY=True,
        SESSION_COOKIE_SAMESITE="Lax",
        SESSION_COOKIE_PATH=EXTERNAL_BASE_PATH,
    )

    # --- Keycloak / OIDC ---
    KEYCLOAK_BASE_URL = os.environ.get("KEYCLOAK_BASE_URL", "").rstrip("/")
    KEYCLOAK_REALM = os.environ.get("KEYCLOAK_REALM", "master")
    KEYCLOAK_CLIENT_ID = os.environ.get("KEYCLOAK_CLIENT_ID", "")
    KEYCLOAK_CLIENT_SECRET = os.environ.get("KEYCLOAK_CLIENT_SECRET", "")
    REQUIRE_AUTH = os.environ.get("REQUIRE_AUTH", "false").lower() in ("1", "true", "yes", "on")

    # Zugriffsbeschraenkung: Nur der per Helm konfigurierte Pod-User (= RDP_USERNAME
    # aus dem rc-user-secret) darf nach erfolgreicher Keycloak-Anmeldung weitermachen.
    # Andere Realm-Nutzer kommen zwar durch das OIDC-Gate, werden aber hier mit 403
    # abgewiesen.
    ALLOWED_USER = os.environ.get("RDP_USERNAME", "").strip()

    oauth = OAuth(app)

    if KEYCLOAK_BASE_URL and KEYCLOAK_CLIENT_ID:
        server_metadata_url = f"{KEYCLOAK_BASE_URL}/realms/{KEYCLOAK_REALM}/.well-known/openid-configuration"

        oauth.register(
            name="keycloak",
            client_id=KEYCLOAK_CLIENT_ID,
            client_secret=KEYCLOAK_CLIENT_SECRET,
            server_metadata_url=server_metadata_url,
            client_kwargs={
                "scope": "openid profile email",
            },
        )


    def _external_url(path: str) -> str:
        """
        Build external URL as seen by the browser.
        Needed because Ingress rewrites /transfer -> / for Flask.
        """
        if not path.startswith("/"):
            path = "/" + path

        scheme = request.headers.get("X-Forwarded-Proto", request.scheme)
        host = request.headers.get("X-Forwarded-Host", request.host)

        return f"{scheme}://{host}{EXTERNAL_BASE_PATH}{path}"


    def _is_authenticated() -> bool:
        return "token" in session
    #keycloak Anpassung Ende

    HTML_TEMPLATE = """
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>File Transfer - {{ "{{ user }}" }} (Consulting version: {{ "{{ version }}" }})</title>
        <style>
          body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-image: url('data:image/png;base64,'); /* Füge hier den vollständigen Base64-String ein */
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: white;
          }

          .container {
            max-width: 800px;
            margin: 3rem auto;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2rem;
            border-radius: 10px;
          }

          h1, h2 {
            color: white;
          }

          input[type="file"] {
            margin-bottom: 1rem;
          }

          button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            background-color: #ffffff;
            color: #003366;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          }

          button:hover {
            background-color: #eeeeee;
          }

          ul {
            list-style: none;
            padding: 0;
          }

          li a {
            color: #ffffff;
            text-decoration: underline;
          }

          li a:hover {
            color: #cccccc;
          }

          .nav-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #ffffff;
            color: #003366;
            text-decoration: none;
            border-radius: 4px;
          }

          .nav-link:hover {
            background-color: #eeeeee;
          }
        </style>
    </head>
    <body>
      <div class="container">
        <h1 style="display: flex; justify-content: space-between; align-items: center;">
        📁 File Transfer for {{ "{{ user }}" }}
        </h1>
        <h2 style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.8em; color: #666;">Consulting version: {{ "{{ version }}" }} <br>Revision: {{ .Release.Revision }}<br>Upload-Limit: {{ .Values.ingress.uploadlimit }}m
        </span>
        </h2>
          
        <!--<h2>🚀 Upload a File (.zip, .xml, .sql)</h2>-->
        <h2>🚀 Upload a File ({{ .Values.transfer.filetypes }})</h2>
        
        <!-- keycloak Anpassung
        <form action="transfer/upload" method="post" enctype="multipart/form-data"> -->
        <form action="{{ "{{ base_path }}" }}/upload" method="post" enctype="multipart/form-data">

          <input type="file" name="file" accept="{{ .Values.transfer.filetypes }}" required>
          <button type="submit">Upload</button>
        </form>

        <h2>📄 Available Files</h2>
        <ul>
          {{ "{% for file in files %}" }}
            <!-- keycloak Anpassung
            <li><a href="transfer/{{ "{{ file }}" }}">{{ "{{ file }}" }}</a></li>
            -->
            <li><a href="{{ "{{ base_path }}" }}/{{ "{{ file }}" }}">{{ "{{ file }}" }}</a></li>

          {{ "{% else %}" }}
            <li><em>No files found.</em></li>
          {{ "{% endfor %}" }}
        </ul>

        <a class="nav-link" href="../guacamole/api/ext/openid/login" target="_blank">🖥️ Open Rich Client</a>
        <a class="nav-link" href="{{ .Values.ingress.indexpage }}" target="_blank">🌐 Open USC Index Page</a>
        <a class="nav-link" href="{{ .Values.openid.userSecurityEndpoint }}" target="_blank">🔒 Password reset</a>

        <h2>📋 Clipboard Sync</h2>
        <!--<form action="/transfer/clipboard/write" method="post" enctype="multipart/form-data">
          <input type="text" name="content" id="clipboardTextInput" placeholder="Insert your clipboard content here..." style="width: 100%; height: 150px;">
          <button type="submit">Write to Guest Clipboard</button>
          <button type="button" onclick="loadClipboard()">Load from Guest Clipboard</button>
        </form>-->
        <form id="clipboardForm" method="post" enctype="multipart/form-data" onkeydown="return event.key !== 'Enter';">
          <textarea name="content" id="clipboardTextInput" placeholder="Insert your clipboard content here..." style="width: 100%; height: 150px;"></textarea>
          <!-- keycloak Anpassung
          <button type="submit" formaction="/transfer/clipboard/write">
          -->
          <button type="submit" formaction="{{ "{{ base_path }}" }}/clipboard/write">
          Write to Guest Clipboard</button>
          <button type="button" onclick="loadClipboard()">Load from Guest Clipboard</button>
        </form>
      </div>

      <script>
        function loadClipboard() {
          //fetch('/transfer/clipboard/read', {
          fetch('{{ "{{ base_path }}" }}/clipboard/read', {
            method: 'POST'
          })
          .then(response => response.text())
          .then(data => {
            document.getElementById('clipboardTextInput').value = data;
          })
          .catch(error => {
            console.error('Error loading clipboard:', error);
          });
        }
      </script>
    </body>
    </html>
    """

    def allowed_file(filename):
        return '.' in filename and filename.rsplit('.', 1)[1].lower() in ALLOWED_EXTENSIONS

    #keycloak Anpassung
    @app.route("/login", strict_slashes=False)
    def login():
        if "keycloak" not in oauth._clients:
            return "Keycloak is not configured (missing env vars).", 500

        redirect_uri = _external_url("/oidc/callback")
        #return oauth.keycloak.authorize_redirect(redirect_uri)
        #return oauth.keycloak.authorize_redirect(
        #    redirect_uri,
        #    code_challenge_method="S256",
        #)
        verifier = _pkce_verifier()
        session["pkce_verifier"] = verifier
        challenge = _pkce_challenge_s256(verifier)

        return oauth.keycloak.authorize_redirect(
            redirect_uri,
            code_challenge=challenge,
            code_challenge_method="S256",
        )




    @app.route("/oidc/callback", strict_slashes=False)
    def oidc_callback():
        if "keycloak" not in oauth._clients:
            return "Keycloak is not configured (missing env vars).", 500

        #token = oauth.keycloak.authorize_access_token()
        verifier = session.pop("pkce_verifier", None)
        token = oauth.keycloak.authorize_access_token(code_verifier=verifier)


        userinfo = token.get("userinfo")
        if not userinfo:
            userinfo = oauth.keycloak.userinfo(token=token)

        session["token"] = token
        session["user"] = userinfo

        return redirect(EXTERNAL_BASE_PATH)


    @app.route("/logout", strict_slashes=False)
    def logout():
        token = session.get("token", {})
        id_token = token.get("id_token")

        session.clear()

        if "keycloak" not in oauth._clients:
            return redirect(EXTERNAL_BASE_PATH)

        metadata = oauth.keycloak.load_server_metadata()
        end_session_endpoint = metadata.get("end_session_endpoint")
        if not end_session_endpoint:
            return redirect(EXTERNAL_BASE_PATH)

        post_logout_redirect_uri = _external_url("/")
        url = f"{end_session_endpoint}?post_logout_redirect_uri={quote(post_logout_redirect_uri)}"

        if id_token:
            url += f"&id_token_hint={quote(id_token)}"

        return redirect(url)


    @app.route("/me", strict_slashes=False)
    def me():
        if not _is_authenticated():
            return jsonify({"authenticated": False}), 200

        return jsonify(
            {
                "authenticated": True,
                "user": session.get("user"),
            }
        ), 200
    #keycloak Anpassung Ende
    
    #keycloak Anpassung: Alle Routen außer den explizit freigegebenen erfordern Authentifizierung. Wenn nicht authentifiziert, Weiterleitung zur Login-Seite.
    @app.before_request
    def maybe_require_auth():
        if not REQUIRE_AUTH:
            return None

        open_paths = {
            "/health",
            "/login",
            "/oidc/callback",
            "/logout",
            "/me",
        }

        if request.path in open_paths:
            return None

        if not _is_authenticated():
            return redirect(f"{EXTERNAL_BASE_PATH}/login")

        # User-Match: Nur ALLOWED_USER darf rein (Stufe B Access-Control).
        if ALLOWED_USER:
            current = (session.get("user") or {}).get("preferred_username", "")
            if current != ALLOWED_USER:
                abort(403, description=(
                    f"Zugriff verweigert. Diese Instanz ist Benutzer "
                    f"'{ALLOWED_USER}' vorbehalten."
                ))

        return None
      #keycloak Anpassung Ende
    
    @app.route("/", strict_slashes=False)
    def index():
        files = sorted([
            f for f in os.listdir(UPLOAD_FOLDER)
            if os.path.isfile(os.path.join(UPLOAD_FOLDER, f)) and allowed_file(f)
        ])
        #keycloak Anpassung
        #return render_template_string(HTML_TEMPLATE, files=files, user=USER, version=VERSION, filetypes=FILETYPES)
        return render_template_string(
            HTML_TEMPLATE,
            files=files,
            user=USER,
            version=VERSION,
            filetypes=FILETYPES,
            base_path=EXTERNAL_BASE_PATH,
        )

        #keycloak Anpassung Ende

    @app.route("/upload", methods=["POST"], strict_slashes=False)
    def upload():
        if "file" not in request.files:
            return "No file part", 400
        file = request.files["file"]
        if file.filename == "":
            return "No selected file", 400
        if file and allowed_file(file.filename):
            filename = secure_filename(file.filename)
            save_path = os.path.join(UPLOAD_FOLDER, filename)
            if not os.path.abspath(save_path).startswith(os.path.abspath(UPLOAD_FOLDER)):
                return "Invalid file path", 400
            file.save(save_path)
            #keycloak Anpassung
            #return redirect(f"/transfer")
            return redirect(EXTERNAL_BASE_PATH)
            #keycloak Anpassung Ende
        else:
            #return f"File type not allowed. Only {FILETYPES} are accepted.", 400
            return "File type not allowed. Only {{ .Values.transfer.filetypes }} are accepted.", 400

    @app.route("/<path:filename>", strict_slashes=False)
    def download_file(filename):
        if not allowed_file(filename):
            abort(403)
        safe_name = secure_filename(filename)
        full_path = os.path.join(UPLOAD_FOLDER, safe_name)
        if not os.path.isfile(full_path) or not os.path.abspath(full_path).startswith(os.path.abspath(UPLOAD_FOLDER)):
            abort(404)
        return send_from_directory(UPLOAD_FOLDER, safe_name, as_attachment=True)

    # 📋 Clipboard API: Schreiben
    @app.route("/clipboard/write", methods=["POST"])
    def write_clipboard():
        try:
            content = request.form.get("content", "")
            with open("/tmp/clipboardhost.txt", "w", encoding="utf-8") as f:
                f.write(content)
            #keycloak Anpassung
            #return redirect("/transfer")  # oder return "OK", wenn kein Redirect gewünscht ist
            return redirect(EXTERNAL_BASE_PATH)
            #keycloak Anpassung Ende
        except Exception as e:
            return f"Fehler beim Schreiben: {str(e)}", 500
        return "TEST CLIPBOARD WRITE"

    # 📋 Clipboard API: Lesen
    @app.route("/clipboard/read", methods=["POST"])
    def read_clipboard():
        try:
            if os.path.exists('/tmp/clipboardguest.txt'):
                with open('/tmp/clipboardguest.txt', "r", encoding="utf-8") as f:
                    content = f.read()
            else:
                content = ""
            #return jsonify({"content": content})
            #return content
            return content, 200, {'Content-Type': 'text/plain; charset=utf-8'}
        except Exception as e:
            #return jsonify({"status": "error", "message": str(e)}), 500
            return "Fehler beim Lesen: {str(e)}", 500

    if __name__ == "__main__":
        os.makedirs(UPLOAD_FOLDER, exist_ok=True)
        app.run(host="0.0.0.0", port=8000)
