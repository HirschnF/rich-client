apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-uploadsrv-{{ .Values.user }}
  namespace: {{ .Values.namespace }}
data:
  uploadserver.py: |
    from flask import Flask, request, send_from_directory, render_template_string, redirect, url_for, abort
    import os
    from werkzeug.utils import secure_filename

    # Configuration
    UPLOAD_FOLDER = "/workspace/usu/data"
    ALLOWED_EXTENSIONS = {"zip", "xml", "sql"}
    USER = "{{ .Values.user }}"

    app = Flask(__name__)

    HTML_TEMPLATE = """
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>File Transfer - {{ "{{ user }}" }}</title>
        <style>
          body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-image: url('data:image/png;base64,'); /* Füge hier den vollständigen Base64-String ein */
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: white;
          }

          .container {
            max-width: 800px;
            margin: 3rem auto;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2rem;
            border-radius: 10px;
          }

          h1, h2 {
            color: white;
          }

          input[type="file"] {
            margin-bottom: 1rem;
          }

          button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            background-color: #ffffff;
            color: #003366;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          }

          button:hover {
            background-color: #eeeeee;
          }

          ul {
            list-style: none;
            padding: 0;
          }

          li a {
            color: #ffffff;
            text-decoration: underline;
          }

          li a:hover {
            color: #cccccc;
          }

          .nav-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #ffffff;
            color: #003366;
            text-decoration: none;
            border-radius: 4px;
          }

          .nav-link:hover {
            background-color: #eeeeee;
          }
        </style>

    </head>
    <body>
      <div class="container">
        <h1>📁 File Transfer for {{ "{{ user }}" }}</h1>

        <h2>🚀 Upload a File (.zip, .xml, .sql)</h2>
        <form action="transfer/upload" method="post" enctype="multipart/form-data">
          <input type="file" name="file" accept=".zip,.xml,.sql" required>
          <button type="submit">Upload</button>
        </form>

        <h2>📄 Available Files</h2>
        <ul>
          {{ "{% for file in files %}" }}
            <li><a href="transfer/{{ "{{ file }}" }}">{{ "{{ file }}" }}</a></li>
          {{ "{% else %}" }}
            <li><em>No files found.</em></li>
          {{ "{% endfor %}" }}
        </ul>
        <a class="nav-link" href="../guacamole" target="_blank">🖥️ Open Jetty Client</a>
      </div>
    </body>
    </html>
    """

    def allowed_file(filename):
        return '.' in filename and filename.rsplit('.', 1)[1].lower() in ALLOWED_EXTENSIONS

    @app.route("/", strict_slashes=False)
    def index():
        files = sorted([
            f for f in os.listdir(UPLOAD_FOLDER)
            if os.path.isfile(os.path.join(UPLOAD_FOLDER, f)) and allowed_file(f)
        ])
        return render_template_string(HTML_TEMPLATE, files=files, user=USER)

    @app.route("/upload", methods=["POST"], strict_slashes=False)
    def upload():
        if "file" not in request.files:
            return "No file part", 400
        file = request.files["file"]
        if file.filename == "":
            return "No selected file", 400
        if file and allowed_file(file.filename):
            filename = secure_filename(file.filename)
            save_path = os.path.join(UPLOAD_FOLDER, filename)

            if not os.path.abspath(save_path).startswith(os.path.abspath(UPLOAD_FOLDER)):
                return "Invalid file path", 400

            file.save(save_path)
            #return redirect(url_for("index"))
            #return redirect(f"/{USER}/transfer")
            return redirect(f"/transfer")
        else:
            return "File type not allowed. Only .zip, .xml, .sql are accepted.", 400

    @app.route("/<path:filename>", strict_slashes=False)
    def download_file(filename):
        if not allowed_file(filename):
            abort(403)
        safe_name = secure_filename(filename)
        full_path = os.path.join(UPLOAD_FOLDER, safe_name)

        if not os.path.isfile(full_path) or not os.path.abspath(full_path).startswith(os.path.abspath(UPLOAD_FOLDER)):
            abort(404)

        return send_from_directory(UPLOAD_FOLDER, safe_name, as_attachment=True)

    if __name__ == "__main__":
        os.makedirs(UPLOAD_FOLDER, exist_ok=True)
        app.run(host="0.0.0.0", port=8000)
