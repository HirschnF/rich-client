apiVersion: v1
kind: Service
metadata:
  name: rc-{{ .Values.user }}-svc
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rc
    user: {{ .Values.user }}
  ports:
    - name: guacamole
      port: 80
      targetPort: 8080
    - name: webjetty
      port: 8087
      targetPort: 8087
    - name: transfer
      port: 8000
      targetPort: 8000
    - name: rdp
      port: 3389         # Port, auf dem der Service erreichbar ist (Cluster-intern)
      targetPort: 3389   # Port im Container (EXPOSE 3389)
      protocol: TCP  