# JDBC-Konfiguration fuer die Guacamole-Datenbank in der bereits vorhandenen
# USM-MariaDB (.Values.db.host). Der Init-Container legt diese DB einmalig an
# (idempotent) und spielt das Schema ein.
guacamoleDb:
  # Eigene Datenbank fuer Guacamole in der bestehenden MariaDB-Instanz
  database: guacamole
  # Eigener Datenbank-Benutzer (nicht root) fuer Guacamole zur Laufzeit
  username: guacamole
  # Passwort fuer den Guacamole-DB-User
  password: changeMeGuacDb20260512
  # Treiber fuer Guacamole JDBC: 'mysql' = MySQL Connector/J (auch fuer MariaDB ok,
  # da wire-kompatibel). 'mariadb' nur wenn MariaDB Connector/J 2.x im Image liegt.
  driver: mysql
